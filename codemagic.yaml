# Codemagic CI/CD — Android release APK.
# iOS workflow will be added later, once the Apple Developer account is ready.
#
# Required secure environment variables (set in Codemagic UI → Environment
# variables, group "petaverse_android", all marked Secure):
#
#   Runtime (--dart-define):
#     API_BASE_URL              e.g. https://petaverse.runasp.net/api
#     REMOTE_SYNC               true
#
#   Google Maps:
#     ANDROID_MAPS_API_KEY      the Android Maps key
#
#   Firebase (base64-encoded files):
#     GOOGLE_SERVICES_JSON      base64 of android/app/google-services.json
#     FIREBASE_OPTIONS_DART     base64 of lib/firebase_options.dart
#
#   Release signing:
#     CM_KEYSTORE               base64 of your upload keystore (.jks)
#     CM_KEYSTORE_PASSWORD
#     CM_KEY_ALIAS
#     CM_KEY_PASSWORD
#
#   Notifications:
#     ARTIFACT_EMAIL            where to send the built APK
#
# Generate base64 on Windows (PowerShell):
#   [Convert]::ToBase64String([IO.File]::ReadAllBytes("android/app/google-services.json"))

workflows:
  android-release:
    name: Android Release (APK)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      groups:
        - petaverse_android
      flutter: stable
      java: 17
    scripts:
      - name: Restore secret files
        script: |
          set -e

          # Google Maps key → android/secrets.properties
          echo "ANDROID_MAPS_API_KEY=$ANDROID_MAPS_API_KEY" > "$CM_BUILD_DIR/android/secrets.properties"

          # Firebase config files (base64-decoded)
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > "$CM_BUILD_DIR/android/app/google-services.json"
          echo "$FIREBASE_OPTIONS_DART" | base64 --decode > "$CM_BUILD_DIR/lib/firebase_options.dart"

          # Release keystore (base64-decoded) + key.properties
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/upload-keystore.jks"
          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Build APK (release)
        script: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=REMOTE_SYNC="$REMOTE_SYNC"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/**/mapping.txt
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - "ralphaj4@gmail.com"
        notify:
          success: true
          failure: true
